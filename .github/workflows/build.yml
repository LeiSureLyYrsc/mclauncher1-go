name: Build

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (Qt6 / miqt)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 and build deps (miqt QML)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            pkg-config \
            build-essential \
            libgl1-mesa-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags '-s -w' -o mclauncher ./cmd/mclauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-linux-amd64
          path: mclauncher
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mclauncher
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows (Qt6 / miqt MinGW)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go version pinned by go.mod (MSVC is incompatible with CGO; MinGW via MSYS2).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # miqt documents MSYS2 UCRT64 + GCC for native Windows Qt6 builds.
      # path-type: inherit so actions/setup-go's Windows Go is visible in msys2 {0}
      # (default "minimal" only keeps cmd/powershell and causes "go: command not found").
      - name: Setup MSYS2 (UCRT64 MinGW + Qt6 QML)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # Prefer UCRT64 toolchain (gcc/pkg-config) over any Windows MSVC tools.
          export PATH="/ucrt64/bin:${PATH}"
          # Belt-and-suspenders: if inherit missed Go, map GOROOT into MSYS paths.
          if ! command -v go >/dev/null 2>&1; then
            if [ -n "${GOROOT:-}" ]; then
              export PATH="$(cygpath -u "${GOROOT}")/bin:${PATH}"
            fi
          fi
          export CC=gcc CXX=g++
          echo "go=$(command -v go)"
          go version
          echo "gcc=$(command -v gcc)"
          gcc --version | head -1
          pkg-config --modversion Qt6Core
          pkg-config --modversion Qt6Qml || pkg-config --modversion Qt6Declarative || true
          go build -ldflags "-s -w" -o mclauncher.exe ./cmd/mclauncher
          ls -la mclauncher.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-windows-amd64
          path: mclauncher.exe
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mclauncher.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
