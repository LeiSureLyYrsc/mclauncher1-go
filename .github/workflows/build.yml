name: Build

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (Qt6 / miqt)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 and build deps (miqt QML)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            pkg-config \
            build-essential \
            libgl1-mesa-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags '-s -w' -o mclauncher ./cmd/mclauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-linux-amd64
          path: mclauncher
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mclauncher
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows (Qt6 / miqt MinGW)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go version pinned by go.mod (MSVC is incompatible with CGO; MinGW via MSYS2).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # miqt documents MSYS2 UCRT64 + GCC for native Windows Qt6 builds.
      # path-type: inherit so actions/setup-go's Windows Go is visible in msys2 {0}
      # (default "minimal" only keeps cmd/powershell and causes "go: command not found").
      # qt6-tools provides windeployqt for packaging Qt/MinGW DLLs next to the exe.
      - name: Setup MSYS2 (UCRT64 MinGW + Qt6 QML)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            zip

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # Prefer UCRT64 toolchain (gcc/pkg-config) over any Windows MSVC tools.
          export PATH="/ucrt64/bin:${PATH}"
          # Belt-and-suspenders: if inherit missed Go, map GOROOT into MSYS paths.
          if ! command -v go >/dev/null 2>&1; then
            if [ -n "${GOROOT:-}" ]; then
              export PATH="$(cygpath -u "${GOROOT}")/bin:${PATH}"
            fi
          fi
          export CC=gcc CXX=g++
          echo "go=$(command -v go)"
          go version
          echo "gcc=$(command -v gcc)"
          gcc --version | sed -n '1p'
          pkg-config --modversion Qt6Core
          pkg-config --modversion Qt6Qml || pkg-config --modversion Qt6Declarative || true
          go build -ldflags "-s -w" -o mclauncher.exe ./cmd/mclauncher
          ls -la mclauncher.exe

      # Bare exe needs MinGW runtime + Qt6 DLLs on PATH / next to the binary.
      # Package a self-contained zip so CI artifacts run without a full MSYS2 install.
      - name: Package Windows runtime (windeployqt + MinGW DLLs)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:${PATH}"
          DEST=dist/mclauncher-windows-amd64
          rm -rf dist
          mkdir -p "$DEST"
          cp -f mclauncher.exe "$DEST/"

          copy_qt_fallback() {
            echo "Copying common Qt6 DLLs/plugins from /ucrt64"
            shopt -s nullglob
            for pattern in \
              Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll \
              Qt6Qml.dll Qt6QmlModels.dll Qt6QmlWorkerScript.dll Qt6QmlMeta.dll \
              Qt6Quick.dll Qt6QuickControls2.dll Qt6QuickControls2Impl.dll \
              Qt6QuickLayouts.dll Qt6QuickTemplates2.dll \
              Qt6QuickDialogs2.dll Qt6QuickDialogs2QuickImpl.dll Qt6QuickDialogs2Utils.dll \
              Qt6OpenGL.dll Qt6Svg.dll Qt6SvgWidgets.dll \
              libb2-1.dll libbrotlicommon.dll libbrotlidec.dll libbz2-1.dll \
              libdouble-conversion.dll libfreetype-6.dll libglib-2.0-0.dll \
              libgraphite2.dll libharfbuzz-0.dll libiconv-2.dll \
              libicudt*.dll libicuin*.dll libicuuc*.dll \
              libintl-8.dll libmd4c.dll libpcre2-16-0.dll libpcre2-8-0.dll \
              libpng16-16.dll libzstd.dll zlib1.dll \
              libssl-3-x64.dll libcrypto-3-x64.dll; do
              for f in /ucrt64/bin/$pattern; do
                [ -f "$f" ] && cp -f "$f" "$DEST/"
              done
            done
            for plugindir in platforms styles imageformats tls networkinformation iconengines; do
              if [ -d "/ucrt64/share/qt6/plugins/$plugindir" ]; then
                mkdir -p "$DEST/$plugindir"
                cp -f /ucrt64/share/qt6/plugins/$plugindir/*.dll "$DEST/$plugindir/" 2>/dev/null || true
              fi
            done
            # Best-effort QML runtime modules (windeployqt normally handles this)
            if [ -d /ucrt64/share/qt6/qml ]; then
              mkdir -p "$DEST/qml"
              cp -a /ucrt64/share/qt6/qml/QtQml "$DEST/qml/" 2>/dev/null || true
              cp -a /ucrt64/share/qt6/qml/QtQuick "$DEST/qml/" 2>/dev/null || true
              cp -a /ucrt64/share/qt6/qml/QML "$DEST/qml/" 2>/dev/null || true
            fi
          }

          WDQ=""
          for cand in windeployqt-qt6 windeployqt6 windeployqt; do
            if command -v "$cand" >/dev/null 2>&1; then
              WDQ="$cand"
              break
            fi
          done

          DEPLOYED=0
          if [ -n "$WDQ" ]; then
            echo "Using $WDQ"
            # --qmldir so QML modules/plugins ship with the app.
            # Do not fail the job if windeployqt errors — fall back to manual copy.
            if "$WDQ" --release --qmldir qml "$DEST/mclauncher.exe"; then
              DEPLOYED=1
            elif "$WDQ" --qmldir qml "$DEST/mclauncher.exe"; then
              DEPLOYED=1
            else
              echo "windeployqt failed; falling back to manual DLL copy" >&2
            fi
          else
            echo "windeployqt not found; falling back to manual DLL copy"
          fi

          if [ "$DEPLOYED" -eq 0 ]; then
            copy_qt_fallback
          fi

          # Always ship MinGW runtime next to the exe (fixes missing libgcc_s_seh-1.dll).
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ ! -f "/ucrt64/bin/$dll" ]; then
              echo "ERROR: missing /ucrt64/bin/$dll" >&2
              exit 1
            fi
            cp -f "/ucrt64/bin/$dll" "$DEST/"
          done

          test -f "$DEST/mclauncher.exe"
          test -f "$DEST/libgcc_s_seh-1.dll"
          test -f "$DEST/libstdc++-6.dll"
          test -f "$DEST/libwinpthread-1.dll"

          # Avoid SIGPIPE/exit 141 under pipefail: never pipe find into head.
          echo "Packaged contents:"
          find "$DEST" -type f | sort > /tmp/pkg-list.txt
          echo "Total files: $(wc -l < /tmp/pkg-list.txt)"
          sed -n '1,200p' /tmp/pkg-list.txt

          if ! command -v zip >/dev/null 2>&1; then
            echo "ERROR: zip not found on PATH" >&2
            exit 1
          fi
          (cd dist && zip -r mclauncher-windows-amd64.zip mclauncher-windows-amd64)
          ls -la dist/mclauncher-windows-amd64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-windows-amd64
          path: dist/mclauncher-windows-amd64.zip
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mclauncher-windows-amd64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
