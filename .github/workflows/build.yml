name: Build

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (Qt6 / miqt + SFX)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 and build deps (miqt QML)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            pkg-config \
            build-essential \
            libgl1-mesa-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            zip

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags '-s -w' -o mclauncher ./cmd/mclauncher

      - name: Bundle Qt runtime + build single-file SFX
        run: |
          set -eu
          chmod +x packaging/scripts/bundle-linux-qt.sh packaging/scripts/make-sfx.sh
          # Deploy tree (libs/plugins/qml) — separate name from the final SFX binary.
          ./packaging/scripts/bundle-linux-qt.sh ./mclauncher dist/mclauncher-linux-amd64-dir
          ./packaging/scripts/make-sfx.sh \
            dist/mclauncher-linux-amd64-dir \
            dist/mclauncher-linux-amd64 \
            mclauncher
          chmod +x dist/mclauncher-linux-amd64
          # Optional: keep deploy tree as tar.gz for debugging.
          tar -C dist -czf dist/mclauncher-linux-amd64-dir.tar.gz mclauncher-linux-amd64-dir
          ls -la dist/mclauncher-linux-amd64 dist/mclauncher-linux-amd64-dir.tar.gz
          # Sanity: SFX trailer magic present
          python3 -c "p=open('dist/mclauncher-linux-amd64','rb').read(); assert p[-8:]==b'MCLSFX01', p[-16:]"

      - name: Upload artifact (single-file SFX)
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-linux-amd64
          path: dist/mclauncher-linux-amd64
          if-no-files-found: error

      - name: Upload artifact (optional deploy tree)
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-linux-amd64-dir
          path: dist/mclauncher-linux-amd64-dir.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mclauncher-linux-amd64
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows (Qt6 / miqt MinGW + SFX)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go version pinned by go.mod (MSVC is incompatible with CGO; MinGW via MSYS2).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # miqt documents MSYS2 UCRT64 + GCC for native Windows Qt6 builds.
      # path-type: inherit so actions/setup-go's Windows Go is visible in msys2 {0}
      # (default "minimal" only keeps cmd/powershell and causes "go: command not found").
      # qt6-tools provides windeployqt for packaging Qt/MinGW DLLs next to the exe.
      - name: Setup MSYS2 (UCRT64 MinGW + Qt6 QML)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-icu
            zip
            python

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          # Prefer UCRT64 toolchain (gcc/pkg-config) over any Windows MSVC tools.
          export PATH="/ucrt64/bin:${PATH}"
          # Belt-and-suspenders: if inherit missed Go, map GOROOT into MSYS paths.
          if ! command -v go >/dev/null 2>&1; then
            if [ -n "${GOROOT:-}" ]; then
              export PATH="$(cygpath -u "${GOROOT}")/bin:${PATH}"
            fi
          fi
          export CC=gcc CXX=g++
          echo "go=$(command -v go)"
          go version
          echo "gcc=$(command -v gcc)"
          gcc --version | sed -n '1p'
          pkg-config --modversion Qt6Core
          pkg-config --modversion Qt6Qml || pkg-config --modversion Qt6Declarative || true
          go build -ldflags "-s -w" -o mclauncher.exe ./cmd/mclauncher
          ls -la mclauncher.exe

      # Bare exe needs MinGW runtime + Qt6 DLLs on PATH / next to the binary.
      # Deploy with windeployqt, then wrap as a single-file Go SFX for clean PCs.
      - name: Package Windows runtime (windeployqt + MinGW DLLs)
        shell: msys2 {0}
        run: |
          # No pipefail: windeployqt/zip/log pipes on Windows runners often yield SIGPIPE (141).
          set -eu
          export PATH="/ucrt64/bin:${PATH}"
          DEST=dist/mclauncher-windows-amd64
          rm -rf dist
          mkdir -p "$DEST"
          cp -f mclauncher.exe "$DEST/"

          WDQ=""
          for cand in windeployqt-qt6 windeployqt6 windeployqt; do
            if command -v "$cand" >/dev/null 2>&1; then
              WDQ="$cand"
              break
            fi
          done

          DEPLOYED=0
          if [ -n "$WDQ" ]; then
            echo "Using $WDQ"
            if "$WDQ" --release --qmldir qml "$DEST/mclauncher.exe" > /tmp/windeployqt.log 2>&1; then
              DEPLOYED=1
            elif "$WDQ" --qmldir qml "$DEST/mclauncher.exe" > /tmp/windeployqt.log 2>&1; then
              DEPLOYED=1
            else
              echo "windeployqt failed; falling back to manual plugin/qml copy" >&2
              tail -n 40 /tmp/windeployqt.log >&2 || true
            fi
          else
            echo "windeployqt not found; falling back to manual plugin/qml copy"
          fi

          if [ "$DEPLOYED" -eq 0 ]; then
            echo "Copying common Qt6 plugins/qml from /ucrt64 (fallback)"
            for plugindir in platforms styles imageformats tls networkinformation iconengines generic; do
              if [ -d "/ucrt64/share/qt6/plugins/$plugindir" ]; then
                mkdir -p "$DEST/$plugindir"
                cp -f /ucrt64/share/qt6/plugins/"$plugindir"/*.dll "$DEST/$plugindir/" 2>/dev/null || true
              fi
            done
            if [ -d /ucrt64/share/qt6/qml ]; then
              mkdir -p "$DEST/qml"
              cp -a /ucrt64/share/qt6/qml/QtQml "$DEST/qml/" 2>/dev/null || true
              cp -a /ucrt64/share/qt6/qml/QtQuick "$DEST/qml/" 2>/dev/null || true
              cp -a /ucrt64/share/qt6/qml/QML "$DEST/qml/" 2>/dev/null || true
            fi
          else
            echo "windeployqt ok (log: /tmp/windeployqt.log)"
          fi

          # ALWAYS copy MinGW/Qt transitive deps via helper script.
          # (Inline multiline python previously broke workflow YAML — unindented lines.)
          # Explicit icu package above; windeployqt never ships ICU/zlib/pcre/etc.
          # Prefer UCRT python; convert /ucrt64 for any Windows python on PATH.
          UCRT_BIN="$(cygpath -w /ucrt64/bin 2>/dev/null || echo /ucrt64/bin)"
          DEST_WIN="$(cygpath -w "$DEST" 2>/dev/null || echo "$DEST")"
          python3 packaging/scripts/copy-mingw-qt-deps.py "$DEST_WIN" --ucrt "$UCRT_BIN"


          find "$DEST" -type f > /tmp/pkg-list.txt
          sort -o /tmp/pkg-list.txt /tmp/pkg-list.txt
          echo "Packaged files: $(wc -l < /tmp/pkg-list.txt)"
          echo "Key artifacts:"
          ls -la "$DEST/mclauncher.exe" "$DEST/libgcc_s_seh-1.dll" "$DEST/libstdc++-6.dll" "$DEST/libwinpthread-1.dll"
          ls -la "$DEST/platforms/qwindows.dll" "$DEST/libpcre2-16-0.dll" "$DEST/zlib1.dll" "$DEST/qt.conf"
          ls -la "$DEST"/libicu*.dll "$DEST"/icu*.dll 2>/dev/null || true
          ls -la "$DEST/qml" 2>/dev/null || echo "(no qml/ yet)"

          if ! command -v zip >/dev/null 2>&1; then
            echo "ERROR: zip not found on PATH" >&2
            exit 1
          fi
          (cd dist && zip -q -r mclauncher-windows-amd64.zip mclauncher-windows-amd64)
          ls -la dist/mclauncher-windows-amd64.zip

      - name: Build single-file SFX exe
        shell: msys2 {0}
        run: |
          set -eu
          export PATH="/ucrt64/bin:${PATH}"
          if ! command -v go >/dev/null 2>&1; then
            if [ -n "${GOROOT:-}" ]; then
              export PATH="$(cygpath -u "${GOROOT}")/bin:${PATH}"
            fi
          fi
          chmod +x packaging/scripts/make-sfx.sh
          ./packaging/scripts/make-sfx.sh \
            dist/mclauncher-windows-amd64 \
            dist/mclauncher-windows-amd64.exe \
            mclauncher.exe
          ls -la dist/mclauncher-windows-amd64.exe
          python3 -c "p=open('dist/mclauncher-windows-amd64.exe','rb').read(); assert p[-8:]==b'MCLSFX01', p[-16:]"

      - name: Upload artifact (single-file SFX)
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-windows-amd64
          path: dist/mclauncher-windows-amd64.exe
          if-no-files-found: error

      - name: Upload artifact (optional zip)
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-windows-amd64-zip
          path: dist/mclauncher-windows-amd64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mclauncher-windows-amd64.exe
            dist/mclauncher-windows-amd64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
